<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Pro - SF2 & Oscilloscope</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/spunaudio-sf2-player@1.0.0/dist/index.min.js"></script>
</head>
<body>
    <canvas id="visualizer"></canvas>

    <div class="ui-panel">
        <div class="panel-section">
            <div class="input-group">
                <label>MIDI File</label>
                <input type="file" id="midiInput" accept=".mid,.midi">
            </div>
            <div class="input-group">
                <label>SoundFont (.sf2)</label>
                <input type="file" id="sf2Input" accept=".sf2">
            </div>
        </div>

        <div class="panel-grid">
            <button id="playBtn" disabled>Upload MIDI & SF2</button>
            <div class="control-item">
                <label>Speed: <span id="speedVal">100%</span></label>
                <input type="range" id="speedSlider" min="50" max="200" value="100">
            </div>
            <div class="control-item">
                <label>Volume</label>
                <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.7">
            </div>
            <div class="control-item">
                <label>Visualization</label>
                <select id="visMode">
                    <option value="SpectrumSplit">Spectrum Split</option>
                    <option value="Waveforms">Waveforms</option>
                    <option value="Spectrum">Spectrum</option>
                </select>
            </div>
            <div class="control-item">
                <label>UI Font</label>
                <select id="fontSelect">
                    <option value="monospace">Default Mono</option>
                    <option value="Orbitron">Orbitron</option>
                    <option value="UPLOAD">-- Load Custom --</option>
                </select>
            </div>
        </div>
        <div id="status">Waiting for files...</div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
